title: easyQDA Theme
author: fre.ms
version: 0.4.0
quarto-required: ">=1.4.0"
contributes:
  formats:
    html:
      theme:
        # Later files win the defaults layer, so the palette must follow
        # the shared file: its $eq-* values have to be defined by the
        # time easyqda.scss's defaults reference them.
        light: [default, easyqda.scss, easyqda-light.scss]
        dark: [default, easyqda.scss, easyqda-dark.scss]
      toc: true
      code-copy: true
      # Adaptive pair (github / github-dark): the default style keeps its
      # light colours in dark mode, where they are unreadable.
      highlight-style: github
